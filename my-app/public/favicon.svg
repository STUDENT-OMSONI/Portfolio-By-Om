<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Black background with subtle dark texture -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <!-- Premium gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#A07830"/>
      <stop offset="30%"  stop-color="#F5D97A"/>
      <stop offset="55%"  stop-color="#C59E59"/>
      <stop offset="80%"  stop-color="#F9E596"/>
      <stop offset="100%" stop-color="#B8892A"/>
    </linearGradient>
    <!-- Subtle gold glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black rounded-square background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Thin gold border -->
  <rect x="2" y="2" width="60" height="60" rx="13" stroke="url(#gold)" stroke-width="0.75" fill="none" opacity="0.5"/>

  <!-- 
    "O" — clean geometric circle (left, slightly smaller)
    Center: (20, 32), radius ~10
  -->
  <circle
    cx="20" cy="32" r="10"
    stroke="url(#gold)"
    stroke-width="2.8"
    fill="none"
    filter="url(#glow)"
  />

  <!-- 
    "S" — clean, modern S letterform (right side)
    Hand-crafted path: two arcs forming a precise S
    Positioned at cx ~44, same vertical center 32
  -->
  <path
    d="
      M 50,22
      C 50,19 47.5,17.5 44,17.5
      C 40.5,17.5 38,19.5 38,22.5
      C 38,25.5 40,26.8 44,28.5
      C 48,30.2 50,31.5 50,34.5
      C 50,37.5 47.5,39.5 44,39.5
      C 40.5,39.5 38,38 38,35
    "
    stroke="url(#gold)"
    stroke-width="2.8"
    stroke-linecap="round"
    fill="none"
    filter="url(#glow)"
  />

  <!-- Divider dot between O and S -->
  <circle cx="31.5" cy="32" r="1.2" fill="url(#gold)" opacity="0.7"/>
</svg>